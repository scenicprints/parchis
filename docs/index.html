<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Games</title>
  <meta name="description" content="Two players, a handful of games, from anywhere.">

  <!-- Runs full-screen with no browser bars once it is added to a home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Games">
  <meta name="theme-color" content="#0B0F15">
  <!-- Chrome on Android will algorithmically darken any page it decides is
       a light one, which turned the printed white board into a near-black
       negative on a real phone. Declaring a scheme says the page does its
       own theming and opts out of that entirely. -->
  <meta name="color-scheme" content="dark light">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <!-- ?v= is bumped on every deploy so phones never run a stale copy -->
  <link rel="stylesheet" href="styles.css?v=20">
</head>
<body>

<div id="app" class="hidden">

  <!-- ───── The lobby ───── -->
  <div id="screen-lobby" class="screen">
    <header class="bar">
      <div class="hubtitle">Games</div>
      <div class="hubrec" id="hub-record">—</div>
    </header>
    <div class="lobby">
      <div class="gamelist" id="gamelist"></div>
    </div>
  </div>

  <!-- ───── A game ─────
       Filled in by the hub when one is opened, and emptied when it leaves,
       so nothing from the last game is still wired to a button in this one. -->
  <div id="screen-game" class="screen hidden"></div>

</div>

<!-- ───── First run: pick a seat ───── -->
<div id="seatpick" class="overlay hidden">
  <div class="card">
    <h1>Games</h1>
    <p class="sub">Take a side. If your name is already on one, tap it to get back in.</p>
    <label class="field">
      <span>Your name</span>
      <input id="seat-name" type="text" maxlength="14" autocomplete="given-name" placeholder="Name">
    </label>
    <div class="seats">
      <button class="seatbtn red" data-color="red">
        <i class="chip"></i>
        <span class="lbl">Red</span>
        <span class="who" id="who-red">Open</span>
      </button>
      <button class="seatbtn blue" data-color="blue">
        <i class="chip"></i>
        <span class="lbl">Blue</span>
        <span class="who" id="who-blue">Open</span>
      </button>
    </div>
    <div class="err" id="seat-err"></div>
  </div>
</div>

<div id="sheet-root"></div>

<div id="boot"><div class="wm">Games</div></div>
<div id="fatal" class="hidden"></div>

<script type="module" src="hub.js?v=20"></script>
</body>
</html>
